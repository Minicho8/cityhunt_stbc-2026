<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Countdown & Game Status Widget</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="widget-page">

    <div id="statusCard" class="status-card state-pending">
        <div class="status-header">
            <div class="pulse-dot"></div>
            <span id="statusTitle" class="status-title">Loading Status...</span>
        </div>
        
        <div class="countdown-container">
            <div class="time-block">
                <span id="hoursVal">00</span>
                <label>Hours</label>
            </div>
            <div class="colon">:</div>
            <div class="time-block">
                <span id="minsVal">00</span>
                <label>Mins</label>
            </div>
            <div class="colon">:</div>
            <div class="time-block">
                <span id="secsVal">00</span>
                <label>Secs</label>
            </div>
        </div>

        <div id="statusMsg" class="status-msg">Connecting to game server...</div>
    </div>

    <script src="index.js"></script>
</body>
</html>
