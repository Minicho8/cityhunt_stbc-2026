<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkpoint</title>
  <!-- Load jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script crossorigin src="../index.js"></script>
  <link rel="stylesheet" crossorigin href="../style.css">
</head>
<body class="checkpoint-page">


    <div id="landingIntro" aria-hidden="true">
        <div class="landing-badge">CityHunt</div>
        <h1 class="landing-title">Checkpoint</h1>
        <p class="landing-subtitle">Your mission is loading</p>
        <div class="landing-loader" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
  <canvas id="bgCanvas" aria-hidden="true"></canvas>

  <header class="site-header">
    <div class="brand-logo-wrap" id="brandLogoWrap">
      <a href="/" >
        <img
          style="max-width: 50%; height: auto;"
          class="brand-logo"
          src="../FUSE_logo_v6.png"
          alt="CityHunt FUSE logo"
          onerror="document.getElementById('brandLogoWrap').style.display='none'"
        >
      </a>
    </div>
    <div class="header-copy">
      <p class="header-kicker">CityHunt Checkpoint</p>
      <h1>綠色任務點</h1>
      <p class="header-subtitle">請按以下 Checkpoint 要求找到任務 Code</p>
    </div>
  </header>

  <!-- Floating Live Countdown & Game Status Widget -->
  <div class="status-card state-pending floating-status">
    <div class="status-header">
      <span class="pulse-dot"></span>
      <span class="status-title" id="statusMessage">距離遊戲開始還有 (Starts in):</span>
    </div>
    <div class="countdown-container">
      <div class="time-block">
        <span id="hours">00</span>
        <label>Hours</label>
      </div>
      <span class="colon">:</span>
      <div class="time-block">
        <span id="minutes">00</span>
        <label>Mins</label>
      </div>
      <span class="colon">:</span>
      <div class="time-block">
        <span id="seconds">00</span>
        <label>Secs</label>
      </div>
    </div>
  </div>

  <div class="card checkpoint-card">
    
    <!-- FORM VIEW (Normal state) -->
    <div id="formView">
      <img id="imgId">
      <p id="contextId" class="subtitle"></p>
      <form id="passwordForm">
        <input 
          type="password" 
          id="passwordInput" 
          placeholder="Enter code..." 
          required 
          autocomplete="off"
        />
        <div class="btn-group">
          <button type="button" class="btn-back backBtn">Go Back To Mission Board
        回到任務墻</button>
          <button type="submit" id="submitBtn" class="btn-submit">Submit</button>
        </div>
      </form>

      <p id="errorMessage" class="error-msg">Invalid code.</p>
    </div>
    <div id="notFoundView">
      <div class="error-icon">⚠️</div>
      <h2>找不到這個任務節點</h2>
      <p class="subtitle">您所要找的任務可能不存在，或已經失效。<p id="missingId"></p></p>
      <button type="button" class="btn-back backBtn" style="width: 100%;">Go Back To Mission Board
        回到任務墻
      </button>
    </div>
  </div>
</body>
</html>
