<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protected Access</title>
  <!-- Load jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f4f4f7;
      color: #333;
    }

    .card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    h2 {
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }

    .subtitle {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      margin-bottom: 1rem;
      outline: none;
      transition: border-color 0.20s;
    }

    input[type="password"]:focus {
      border-color: #0066ff;
    }

    /* Button Group for Submit + Back */
    .btn-group {
      display: flex;
      gap: 0.75rem;
    }

    button {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.20s, border-color 0.20s;
    }

    .btn-submit {
      background-color: #0066ff;
      color: white;
    }

    .btn-submit:hover {
      background-color: #0052cc;
    }

    .btn-back {
      background-color: #e4e6eb;
      color: #4b4f56;
    }

    .btn-back:hover {
      background-color: #d8dadf;
    }

    .error-msg {
      color: #e53e3e;
      font-size: 0.85rem;
      margin-top: 1rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Protected Access</h2>
    <p class="subtitle">Enter password for ID: <strong id="displayId">default</strong></p>

    <form id="passwordForm">
      <input 
        type="password" 
        id="passwordInput" 
        placeholder="Enter password..." 
        required 
        autocomplete="off"
      />
      <div class="btn-group">
        <button type="button" id="backBtn" class="btn-back">Back</button>
        <button type="submit" id="submitBtn" class="btn-submit">Access</button>
      </div>
    </form>

    <p id="errorMessage" class="error-msg">Invalid password for this ID.</p>
  </div>

  <script>
    // --- MAP IDs TO PASSWORDS & TARGET URLs ---
    const pageData = {
      "1": {
        "pass1": "https://google.com",
        "pass2": "https://wikipedia.org"
      },
      "2": {
        "secret123": "https://github.com",
        "admin": "https://stackoverflow.com"
      },
      "clientA": {
        "clientpass": "https://example.com/client-a-dashboard"
      }
    };

    $(document).ready(function() {
      // 1. Extract 'id' parameter from current URL
      const urlParams = new URLSearchParams(window.location.search);
      const currentId = urlParams.get('id') || "1"; // Default to "1"

      // Update UI to show active ID
      $("#displayId").text(currentId);

      // 2. Handle form submission
      $("#passwordForm").on("submit", function(e) {
        e.preventDefault();

        const enteredPassword = $("#passwordInput").val().trim();

        if (pageData[currentId] && pageData[currentId][enteredPassword]) {
          $("#errorMessage").hide();
          const targetUrl = pageData[currentId][enteredPassword];
          window.location.href = targetUrl;
        } else {
          $("#errorMessage").fadeIn();
          $("#passwordInput").val("").focus();
        }
      });

      // 3. Handle Back button click
      $("#backBtn").on("click", function() {
        // If there's previous history in this tab, go back
        if (document.referrer && history.length > 1) {
          window.history.back();
        } else {
          // Fallback location if opened directly in a new tab
          window.location.href = "https://google.com"; // Adjust fallback as needed
        }
      });
    });
  </script>

</body>
</html>
